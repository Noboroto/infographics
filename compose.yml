services:
  web:
    image: nginx:alpine
    container_name: infographics-web
    expose:
      - "80"
    volumes:
      - .:/usr/share/nginx/html:ro
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    restart: unless-stopped
    networks:
      - infographics-network

networks:
  infographics-network:
    external: true
    name: multi-domain
